name: Combat Tests

on:
  workflow_dispatch:

jobs:
  combat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import project and register script classes
        run: timeout --signal=KILL 90s godot --headless --editor --path . --quit
      - name: Run combat regression gate
        run: |
          set -o pipefail
          timeout --signal=KILL 45s stdbuf -oL -eL godot --headless --path . --script res://tests/combat/combat_regression_runner.gd 2>&1 | tee combat-regression.log
      - name: Upload combat regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-regression-diagnostics
          path: combat-regression.log
          if-no-files-found: warn
          retention-days: 1
      - name: Run first tournament
        run: timeout --signal=KILL 45s godot --headless --path . --script res://tests/combat/tournament_runner.gd

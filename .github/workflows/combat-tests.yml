name: Combat Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  combat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import project and register script classes
        run: timeout 120s godot --headless --editor --path . --quit
      - name: Run combat tests and first tournament
        run: timeout 120s godot --headless --path . --script res://tests/combat/tournament_runner.gd

name: Map generation connectivity

on:
  push:
    branches:
      - feature/equipment-instance-chain
  pull_request:
  workflow_dispatch:

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Validate 200 generated maps
        run: godot --headless --path . --script res://tests/map_generation_connectivity.gd

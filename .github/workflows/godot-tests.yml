name: Godot Tests

on:
  workflow_dispatch:

jobs:
  location-generator:
    name: Location Generator 200-seed stress test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Import project and build script class cache
        run: timeout 120s godot --headless --editor --path . --quit

      - name: Run Location Generator stress test
        run: timeout 120s godot --headless --path . --script res://tests/map/location_generator_runner.gd

      - name: Run Debug Map Viewer smoke test
        run: timeout 120s godot --headless --path . --script res://tests/map/debug_map_viewer_runner.gd

      - name: Run Combat v1 regression baseline
        run: timeout 120s godot --headless --path . --script res://tests/combat/combat_regression_runner.gd

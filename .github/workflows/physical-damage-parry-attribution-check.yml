name: Physical Damage Parry Attribution Check (SWORD_DEF)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parry-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Compile Godot project
        run: GODOT_TEST_TIMEOUT=90 bash tools/run_godot_check.sh --import
      - name: SWORD_DEF smoke (one fight)
        run: GODOT_TEST_TIMEOUT=120 bash tools/run_godot_check.sh tests/combat/physical_damage_benchmark_full_runner.gd --single-only --archetype=SWORD_DEF --battles=1
      - name: SWORD_DEF 50-fight attribution regression
        run: GODOT_TEST_TIMEOUT=600 bash tools/run_godot_check.sh tests/combat/physical_damage_benchmark_full_runner.gd --single-only --archetype=SWORD_DEF --battles=50 --expect-parry-attribution
      - name: Upload report and execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parry-attribution-check-results
          path: |
            test-results/physical-damage-benchmark/report.txt
            test-results/final-par/physical_damage_benchmark_full_runner.gd.log
          if-no-files-found: warn
          retention-days: 30

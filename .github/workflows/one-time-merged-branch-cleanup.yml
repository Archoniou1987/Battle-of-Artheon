name: One-time remove merged historical branches
on:
  push:
    branches: [feature/character-inventory-ui-v1]
    paths: [.github/workflows/one-time-merged-branch-cleanup.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Safely delete only unchanged branches with zero unique commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error, urllib.parse
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = "feature/character-inventory-ui-v1"
          branches = {
            "feature/abi-simulation": "899c5922599d16581b8708c55fb82c7c869a942c",
            "feature/dynamic-abi-strip-20261103": "2d1e123d1fbadec695961b7a9180e947f17a6860",
            "feature/inventory-ownership": "e8a839e447935e3c9af9472c5bcd026c2be2d346",
            "feature/v12-live-item-inventory-20261103": "3c1252de834ea1e10a297ce8b3e2c8389aa12a80",
            "feature/v12-physical-sword-abi-eff-integration": "5a26027d92c394a0d92bf712da402eefc5b529f1",
            "feature/v12-single-template-generator-20261103": "5738e47d043ae9d9f8d10a3c603e34640555c5b6",
            "fix/abi-counterattack-migration-20261103": "4fa5194e4cb33fef1ee6405ad11c6d67990b5817",
            "fix/arena-open-smoke-manual-blocks-20261103": "95fc03e195aaddf26eba902e5127f198fa0f459c",
            "fix/round-ui-required-actions-stun-20261103": "516dffde7aae81b97df4f53160053b5ebe7626bc",
            "staging/v12-pendant-no-ci": "4e765401dad77e889bc69a1b250943ff4fe28e27",
            "staging/v12-remaining-fixes-no-ci": "7de0f21ff89524c9423a835c2827648b337ad9d5"
          }
          def api(method, path):
              request = urllib.request.Request("https://api.github.com/repos/" + repo + "/" + path,
                  headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},method=method)
              try:
                  with urllib.request.urlopen(request) as res:
                      body = res.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as ex:
                  print("API ERROR:",method,path,ex.code,ex.read().decode()[:250],flush=True)
                  raise
          open_prs = api("GET","pulls?state=open&per_page=100")
          protected = set(p["head"]["ref"] for p in open_prs)
          failures = []
          for name, expected_sha in branches.items():
              if name in protected or name in ("main", base):
                  print("SKIP protected:",name); continue
              quoted = urllib.parse.quote(name,safe="")
              try:
                  info = api("GET","branches/" + quoted)
                  if info["commit"]["sha"] != expected_sha:
                      print("SKIP branch updated:",name); continue
                  compare = api("GET","compare/" + urllib.parse.quote(base,safe="") + "..." + quoted)
                  if int(compare["ahead_by"]) != 0:
                      print("SKIP unmerged commits:",name); continue
                  api("DELETE","git/refs/heads/" + quoted)
                  print("DELETED safe branch:",name,flush=True)
              except Exception as ex:
                  failures.append((name,str(ex)))
          print("CLEANUP_FAILS:",failures)
          sys.exit(1 if failures else 0)
          PY

name: Web Preview (Godot)

on:
  workflow_dispatch:
    inputs:
      publish_to_vercel:
        description: 'Publish browser build to Vercel (requires VERCEL_TOKEN secret)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: godot-web-preview
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install Godot and web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Import Godot project
        run: timeout 180s godot --headless --editor --path . --quit

      - name: Character progression smoke test
        run: timeout 120s godot --headless --path . --script res://tests/character/progression_smoke.gd

      - name: CharacterState integration smoke test
        run: timeout 120s godot --headless --path . --script res://tests/character/character_state_progression_smoke.gd

      - name: Character and inventory persistence smoke test
        run: timeout 120s godot --headless --path . --script res://tests/character/persistence_smoke.gd

      - name: Character UI smoke test
        run: timeout 120s godot --headless --path . --script res://tests/ui/character_screen_runner.gd

      - name: Arena opening smoke test
        run: timeout 120s godot --headless --path . --script res://tests/ui/arena_open_smoke.gd

      - name: Install virtual display for visual previews
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Capture Godot UI previews
        run: timeout 120s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tests/ui/inventory_visual_capture.gd

      - name: Upload UI preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-ui-preview
          path: visual-preview/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Export browser build
        run: |
          mkdir -p build/web
          timeout 180s godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Save browser build as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: battle-of-artheon-web
          path: build/web/
          retention-days: 7

      - name: Install Node.js for Vercel publishing
        if: ${{ inputs.publish_to_vercel }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish Web build to Vercel
        if: ${{ inputs.publish_to_vercel }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing. Create it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p build/web/.vercel
          printf '%s\n' '{"projectId":"prj_O8XlqWc2OFjUvp9Z1RojYFiMOVCl","orgId":"team_3X6DttKAdVaDmYJVv5SYCcsA"}' > build/web/.vercel/project.json
          npx --yes vercel@latest deploy build/web --prod --yes --token "$VERCEL_TOKEN" --scope dryun87-9174

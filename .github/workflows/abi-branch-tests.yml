name: ABI Branch Tests
on:
  push:
    branches: [feature/abi-simulation, feature/equipment-instance-chain]
jobs:
  abi-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run combat tournament with ABI
        run: godot --headless --path . --script res://tests/combat/tournament_runner.gd
      - name: Generate and validate 100 items
        run: godot --headless --path . --script res://tests/items/item_generator_runner.gd
      - name: Equip generated item and run combat
        run: godot --headless --path . --script res://tests/items/generated_item_combat_runner.gd

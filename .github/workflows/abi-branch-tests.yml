name: ABI Branch Tests
on:
  workflow_dispatch:
jobs:
  abi-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: bash tools/run_godot_check.sh --import
      - name: Verify final PAR, RatingMatrix and magic contracts
        run: |
          bash tools/run_godot_check.sh tests/parameters/rating_matrix_runner.gd
          bash tools/run_godot_check.sh tests/parameters/final_par_combat_runner.gd
          bash tools/run_godot_check.sh tests/combat/magic_abi_scaling_runner.gd
      - name: Validate round-boundary group-combat checkpoints and deterministic resume
        run: |
          status=0
          for script in \
            tests/combat/group_combat_checkpoint_runner.gd \
            tests/combat/group_combat_terminal_checkpoint_runner.gd
          do
            echo "::group::Checkpoint: $script"
            if ! bash tools/run_godot_check.sh "$script"; then
              echo "::error::Checkpoint regression: $script"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Bind real combat verdict to one-time map reward
        run: bash tools/run_godot_check.sh tests/map/map_real_duel_reward_chain_runner.gd

      - name: Replay terminal map combat settlement without duplicate world rewards
        run: bash tools/run_godot_check.sh tests/map/map_combat_settlement_resume_runner.gd

      - name: Validate Solo expedition save before combat and after multiple encounters
        run: bash tools/run_godot_check.sh tests/map/expedition_save_runner.gd

      - name: Migrate town to canonical save without stale writes and keep Arena resource persistence
        run: bash tools/run_godot_check.sh tests/map/solo_town_canonical_migration_runner.gd

      - name: Adopt closed Solo expedition into single atomic town save without duplicating loot
        run: bash tools/run_godot_check.sh tests/map/solo_town_save_adoption_runner.gd

      - name: Seal Solo expedition exit and return only owned item instances
        run: bash tools/run_godot_check.sh tests/map/solo_town_return_runner.gd

      - name: Preserve town character inventory on Solo expedition handoff and reopen
        run: bash tools/run_godot_check.sh tests/map/solo_town_expedition_bridge_runner.gd

      - name: Block Solo map entry until expedition and pending combat are reconciled
        run: bash tools/run_godot_check.sh tests/map/solo_launch_gate_runner.gd

      - name: Verify two real Solo battles share one expedition save and unique ground loot
        run: bash tools/run_godot_check.sh tests/map/expedition_two_real_fights_runner.gd

      - name: Validate atomic world snapshot and safe journal acknowledgement
        run: bash tools/run_godot_check.sh tests/map/map_world_commit_runner.gd

      - name: Validate Solo per-cell ground loot persistence and timed pickup
        run: bash tools/run_godot_check.sh tests/map/ground_loot_solo_runner.gd

      - name: Prove Solo group combat rewards land on the current hex before pickup
        run: bash tools/run_godot_check.sh tests/map/ground_loot_combat_e2e_runner.gd

      - name: Project current Solo cell items NPCs and interactive objects
        run: bash tools/run_godot_check.sh tests/map/cell_content_solo_runner.gd

      - name: Render current Solo cell icon tabs and selection without world mutations
        run: bash tools/run_godot_check.sh tests/ui/cell_content_panel_runner.gd

      - name: Validate canonical ABI003 Fireball and EFF003 Burning lifecycle
        run: bash tools/run_godot_check.sh tests/combat/abi003_fireball_runner.gd
      - name: Validate isolated ABI Test Lab physical and magical PAR calculations
        run: bash tools/run_godot_check.sh tests/combat/abi_test_lab_runner.gd
      - name: Open ABI Test Lab from Arena and preserve live resources
        run: bash tools/run_godot_check.sh tests/ui/abi_test_lab_open_runner.gd
      - name: Validate Arena controls, EFF indicators and tactile square UI
        run: |
          # Report all three UI results in one manually initiated workflow.
          status=0
          for script in \
            tests/ui/arena_open_smoke.gd \
            tests/ui/elixir_abi_press_runner.gd \
            tests/ui/square_slot_interaction_runner.gd \
            tests/ui/arena_terminal_persistence_runner.gd
          do
            echo "::group::UI smoke: $script"
            if ! bash tools/run_godot_check.sh "$script"; then
              echo "::error::UI regression: $script"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Validate simultaneous round, ABI/EFF integration and resolved Arena journal
        run: |
          # Run every integration runner even if a prior one fails. This
          # surfaces all regressions in one manual Actions run.
          status=0
          # Stage 0 first; full integration only after the isolated phases.
          for script in \
            tests/combat/arena_basic_round_runner.gd \
            tests/combat/battle_baseline_runner.gd \
            tests/combat/integrated_round_phases_runner.gd \
            tests/combat/physical_stage_matrix_runner.gd \
            tests/combat/arena_ability_integration_runner.gd \
            tests/combat/full_battle_vertical_slice_runner.gd \
            tests/combat/arena_real_eff_chain_runner.gd \
            tests/combat/arena_long_battle_runner.gd \
            tests/combat/arena_tempo_terminal_runner.gd \
            tests/combat/arena_combat_log_runner.gd \
            tests/combat/arena_dual_support_round_runner.gd \
            tests/combat/arena_round_timing_interaction_runner.gd \
            tests/combat/round_effect_death_regression_runner.gd \
            tests/combat/instant_effect_surprise_runner.gd \
            tests/combat/elixir_mind_game_runner.gd
          do
            echo "::group::Integration: $script"
            echo "COMBAT_TEST_SCRIPT=$script"
            if ! bash tools/run_godot_check.sh "$script"; then
              echo "::error::Integration runner failed: $script"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Run combat tournament with ABI
        run: bash tools/run_godot_check.sh tests/combat/tournament_runner.gd
      - name: Generate and validate 100 items
        run: bash tools/run_godot_check.sh tests/items/item_generator_runner.gd
      - name: Equip generated item and run combat
        run: bash tools/run_godot_check.sh tests/items/generated_item_combat_runner.gd
      - name: Reject inventory and equipment exploits
        run: bash tools/run_godot_check.sh tests/items/inventory_exploit_runner.gd
      - name: Validate character ownership chain
        run: bash tools/run_godot_check.sh tests/items/character_ownership_chain_runner.gd
      - name: Validate item ABI slot chain
        run: bash tools/run_godot_check.sh tests/items/item_abi_chain_runner.gd
      - name: Cast item-provided ABI in combat
        run: bash tools/run_godot_check.sh tests/items/item_abi_combat_runner.gd
      - name: Generate item with EFF001
        run: bash tools/run_godot_check.sh tests/items/generated_eff001_item_runner.gd
      - name: Apply generated EFF001 in combat
        run: bash tools/run_godot_check.sh tests/items/generated_eff001_combat_runner.gd
      - name: Validate EFF stacking and source ownership
        run: bash tools/run_godot_check.sh tests/combat/effect_stacking_runner.gd
      - name: Build two ready characters and fight
        run: bash tools/run_godot_check.sh tests/character/character_combat_builder_runner.gd
      - name: Build ten equipped potential players and stats
        run: bash tools/run_godot_check.sh tests/character/ten_player_stats_runner.gd
      - name: Roll NPC loot into player inventory
        run: bash tools/run_godot_check.sh tests/loot/loot_pipeline_runner.gd
      - name: Award NPC loot after combat victory
        run: bash tools/run_godot_check.sh tests/loot/combat_loot_runner.gd
      - name: Validate persistent NPC entities
        run: bash tools/run_godot_check.sh tests/npc/npc_entity_runner.gd
      - name: Validate scalable loot groups and quest conditions
        run: bash tools/run_godot_check.sh tests/loot/loot_group_level_runner.gd
      - name: Fight unarmed bandit and validate scaled dagger drop
        run: bash tools/run_godot_check.sh tests/loot/dagger_level_drop_runner.gd
      - name: Simulate NPC possessions entering loot roll
        run: bash tools/run_godot_check.sh tests/loot/npc_possession_loot_runner.gd
      - name: Validate NPC to worn loot condition chain
        run: bash tools/run_godot_check.sh tests/loot/npc_worn_loot_chain_runner.gd

      - name: Open dungeon chest and award loot once
        run: bash tools/run_godot_check.sh tests/loot/chest_loot_runner.gd
      - name: Validate loot persistence across repository inventory and expedition restart
        run: bash tools/run_godot_check.sh tests/loot/loot_persistence_restart_runner.gd
      - name: Validate item durability lifetime
        run: bash tools/run_godot_check.sh tests/items/item_durability_runner.gd
      - name: Generate crafted and worn loot conditions
        run: bash tools/run_godot_check.sh tests/items/item_initial_condition_runner.gd
      - name: Repair items, treat draws as defeats, and simulate breakage
        run: |
          mkdir -p test-results
          bash tools/run_godot_check.sh tests/items/hundred_bot_durability_runner.gd
      - name: Upload 100-battle durability report
        uses: actions/upload-artifact@v4
        with:
          name: hundred-battle-durability-report
          path: test-results/hundred_bot_durability_report.json
      - name: Apply equipment wear from actual combat defeat
        run: bash tools/run_godot_check.sh tests/items/combat_defeat_consequence_runner.gd
      - name: Damage all equipped items after defeat
        run: bash tools/run_godot_check.sh tests/items/defeat_equipment_wear_runner.gd

      - name: Validate grouped NPC combat and loot on hex map
        run: bash tools/run_godot_check.sh tests/map/hex_map_group_encounter_e2e_runner.gd

      - name: Validate map coin visibility
        run: bash tools/run_godot_check.sh tests/map/debug_map_viewer_runner.gd

      - name: Validate hex loot expiry
        run: bash tools/run_godot_check.sh tests/map/hex_loot_expiry_runner.gd

      - name: Validate expedition persistence and square-grid foundation
        run: bash tools/run_godot_check.sh tests/map/expedition_foundation_runner.gd

      - name: Validate square map movement and pathfinding
        run: bash tools/run_godot_check.sh tests/map/square_map_movement_runner.gd

      - name: Validate co-located non-blocking square map entities
        run: bash tools/run_godot_check.sh tests/map/square_map_entity_runner.gd

      - name: Bridge square map NPC contact into encounter
        run: bash tools/run_godot_check.sh tests/map/square_map_encounter_bridge_runner.gd

      - name: Build grouped square map encounter into combat state
        run: bash tools/run_godot_check.sh tests/map/square_map_group_combat_state_runner.gd

      - name: Validate square map group active opponent progression
        run: bash tools/run_godot_check.sh tests/map/square_map_active_opponent_runner.gd

      - name: Simulate one versus many combat rounds
        run: bash tools/run_godot_check.sh tests/combat/group_combat_simulator_runner.gd

      - name: Cast ABI during group combat
        run: bash tools/run_godot_check.sh tests/combat/group_combat_ability_runner.gd

      - name: Resolve square map group combat outcome
        run: bash tools/run_godot_check.sh tests/map/square_map_group_combat_outcome_runner.gd

      - name: Validate square map group encounter end to end
        run: bash tools/run_godot_check.sh tests/map/square_map_group_encounter_e2e_runner.gd

      - name: Validate tactical map movement and resource area
        run: bash tools/run_godot_check.sh tests/map/tactical_map_runner.gd

      - name: Validate hex geometry and weighted pathfinding
        run: bash tools/run_godot_check.sh tests/map/hex_pathfinding_runner.gd

      - name: Stress test hex movement and pathfinding
        run: bash tools/run_godot_check.sh tests/map/hex_pathfinding_stress_runner.gd

      - name: Validate hex exploration persistence
        run: bash tools/run_godot_check.sh tests/map/hex_exploration_runner.gd

      - name: Validate overlapping map areas and transitions
        run: bash tools/run_godot_check.sh tests/map/map_areas_runner.gd

      - name: Connect map objects and persistent NPC instances
        run: bash tools/run_godot_check.sh tests/map/world_object_interaction_runner.gd

      - name: Start combat from map NPC encounter
        run: bash tools/run_godot_check.sh tests/map/map_encounter_combat_runner.gd

      - name: Resolve map combat victory into death and loot
        run: bash tools/run_godot_check.sh tests/map/map_combat_outcome_runner.gd

      - name: Validate fixed resource definitions and level ranges
        run: bash tools/run_godot_check.sh tests/resources/resource_definition_runner.gd

      - name: Validate resource source stock yield depletion and recovery
        run: bash tools/run_godot_check.sh tests/resources/resource_source_runner.gd

      - name: Validate tool slot and resource interaction modes
        run: bash tools/run_godot_check.sh tests/resources/resource_tool_interaction_runner.gd

      - name: Validate tool-gated resource gathering end to end
        run: bash tools/run_godot_check.sh tests/resources/resource_gathering_tool_runner.gd

      - name: Validate Hex Encounter triggers conditions and persistence
        run: bash tools/run_godot_check.sh tests/map/hex_encounter_runner.gd

      - name: Resolve Hex Encounters into world consequences
        run: bash tools/run_godot_check.sh tests/map/hex_encounter_world_runner.gd

      - name: Chain Hex Encounters through persistent world flags
        run: bash tools/run_godot_check.sh tests/map/hex_encounter_chain_runner.gd

      - name: Validate universal NPC detection and hex combat joining
        run: bash tools/run_godot_check.sh tests/map/hex_npc_detection_join_runner.gd

      - name: Validate integrated NPC patrol chase group combat and resume
        run: bash tools/run_godot_check.sh tests/map/hex_npc_integration_runner.gd

      - name: Validate NPC map bounds and unreachable routes
        run: bash tools/run_godot_check.sh tests/map/hex_npc_boundary_runner.gd

      - name: Validate group encounter lock and patrol resume
        run: bash tools/run_godot_check.sh tests/map/hex_group_pause_runner.gd

      - name: Validate NPC chase retry suppression
        run: bash tools/run_godot_check.sh tests/map/hex_npc_retry_runner.gd

      - name: Validate NPC aggression latch and freeze edge cases
        run: bash tools/run_godot_check.sh tests/map/hex_npc_edge_runner.gd

      - name: Validate bounded NPC pursuit and combat contact
        run: bash tools/run_godot_check.sh tests/map/hex_npc_chase_runner.gd

      - name: Validate patrol chase return and route resume
        run: bash tools/run_godot_check.sh tests/map/hex_patrol_chase_runner.gd

      - name: Validate hex patrol movement and combat pause
        run: bash tools/run_godot_check.sh tests/map/hex_patrol_state_runner.gd

      - name: Generate 200 traversable tactical Locations
        run: bash tools/run_godot_check.sh tests/map/location_generator_runner.gd

name: ABI Branch Tests
on:
  push:
    branches: [feature/abi-simulation, feature/equipment-instance-chain]
jobs:
  abi-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run combat tournament with ABI
        run: godot --headless --path . --script res://tests/combat/tournament_runner.gd
      - name: Generate and validate 100 items
        run: godot --headless --path . --script res://tests/items/item_generator_runner.gd
      - name: Equip generated item and run combat
        run: godot --headless --path . --script res://tests/items/generated_item_combat_runner.gd
      - name: Reject inventory and equipment exploits
        run: godot --headless --path . --script res://tests/items/inventory_exploit_runner.gd
      - name: Validate character ownership chain
        run: godot --headless --path . --script res://tests/items/character_ownership_chain_runner.gd
      - name: Validate item ABI slot chain
        run: godot --headless --path . --script res://tests/items/item_abi_chain_runner.gd
      - name: Cast item-provided ABI in combat
        run: godot --headless --path . --script res://tests/items/item_abi_combat_runner.gd
      - name: Generate item with EFF001
        run: godot --headless --path . --script res://tests/items/generated_eff001_item_runner.gd
      - name: Apply generated EFF001 in combat
        run: godot --headless --path . --script res://tests/items/generated_eff001_combat_runner.gd
      - name: Validate EFF stacking and source ownership
        run: godot --headless --path . --script res://tests/combat/effect_stacking_runner.gd
      - name: Build two ready characters and fight
        run: godot --headless --path . --script res://tests/character/character_combat_builder_runner.gd
      - name: Build ten equipped potential players and stats
        run: godot --headless --path . --script res://tests/character/ten_player_stats_runner.gd
      - name: Roll NPC loot into player inventory
        run: godot --headless --path . --script res://tests/loot/loot_pipeline_runner.gd
      - name: Award NPC loot after combat victory
        run: godot --headless --path . --script res://tests/loot/combat_loot_runner.gd

      - name: Open dungeon chest and award loot once
        run: godot --headless --path . --script res://tests/loot/chest_loot_runner.gd
      - name: Validate item durability lifetime
        run: godot --headless --path . --script res://tests/items/item_durability_runner.gd
      - name: Generate crafted and worn loot conditions
        run: godot --headless --path . --script res://tests/items/item_initial_condition_runner.gd
      - name: Repair items, treat draws as defeats, and simulate breakage
        run: |
          mkdir -p test-results
          godot --headless --path . --script res://tests/items/hundred_bot_durability_runner.gd
      - name: Upload 100-battle durability report
        uses: actions/upload-artifact@v4
        with:
          name: hundred-battle-durability-report
          path: test-results/hundred_bot_durability_report.json
      - name: Apply equipment wear from actual combat defeat
        run: godot --headless --path . --script res://tests/items/combat_defeat_consequence_runner.gd
      - name: Damage all equipped items after defeat
        run: godot --headless --path . --script res://tests/items/defeat_equipment_wear_runner.gd

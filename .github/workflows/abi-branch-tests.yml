name: ABI Branch Tests
on:
  push:
    branches: [feature/abi-simulation, feature/equipment-instance-chain]
jobs:
  abi-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run combat tournament with ABI
        run: godot --headless --path . --script res://tests/combat/tournament_runner.gd
      - name: Generate and validate 100 items
        run: godot --headless --path . --script res://tests/items/item_generator_runner.gd
      - name: Equip generated item and run combat
        run: godot --headless --path . --script res://tests/items/generated_item_combat_runner.gd
      - name: Reject inventory and equipment exploits
        run: godot --headless --path . --script res://tests/items/inventory_exploit_runner.gd
      - name: Validate character ownership chain
        run: godot --headless --path . --script res://tests/items/character_ownership_chain_runner.gd
      - name: Validate item ABI slot chain
        run: godot --headless --path . --script res://tests/items/item_abi_chain_runner.gd
      - name: Cast item-provided ABI in combat
        run: godot --headless --path . --script res://tests/items/item_abi_combat_runner.gd
      - name: Generate item with EFF001
        run: godot --headless --path . --script res://tests/items/generated_eff001_item_runner.gd
      - name: Apply generated EFF001 in combat
        run: godot --headless --path . --script res://tests/items/generated_eff001_combat_runner.gd
      - name: Validate EFF stacking and source ownership
        run: godot --headless --path . --script res://tests/combat/effect_stacking_runner.gd
      - name: Build two ready characters and fight
        run: godot --headless --path . --script res://tests/character/character_combat_builder_runner.gd
